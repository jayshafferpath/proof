<style>

      --line: #262c35; --line-2: #333b46;
      --accent: #a5a3f5; --accent-soft: #23233a; --accent-ink: #c9c8fb;
      --author: #46b6bf; --author-soft: #12292b;

    --ink: #e8ecf2; --ink-2: #aab3c0; --ink-3: #717d8c;
    --line: #262c35; --line-2: #333b46;

  .brand .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40ch; }
  .brand .repo { color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
  .spacer { flex: 1 1 auto; }
  .theme-toggle { font: inherit; font-size: 12px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }

  /* track toggle */
  .trackbar { display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tracks { display: flex; gap: 2px; }
  .track-tab {
    font: inherit; font-size: 13.5px; font-weight: 560; cursor: pointer;
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 11px 2px; margin-right: 22px; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .track-tab:hover { color: var(--ink-2); }
  .track-tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .track-tab .cnt { font-family: var(--mono); font-size: 11px; background: var(--surface-2); color: var(--ink-3); padding: 1px 6px; border-radius: 999px; }
  .track-tab.on .cnt { background: var(--accent-soft); color: var(--accent-ink); }
  .crumb {
    display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2);
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
    border-radius: 999px; padding: 4px 6px 4px 11px;
  }
  .crumb.show { display: inline-flex; }
  .crumb .back { font: inherit; font-size: 12px; cursor: pointer; border: none; background: var(--surface); color: var(--accent-ink); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
  .crumb .back:hover { filter: brightness(.97); }

  .view { min-height: 0; overflow: hidden; }
  .cols { display: grid; min-height: 0; height: 100%; overflow: hidden; }
  .cols.beh { grid-template-columns: 1fr; }
  .cols.dec { grid-template-columns: minmax(250px, 320px) minmax(340px, 1fr); }
  .beh-col { display: flex; flex-direction: column; }
  .beh-col > .acc { flex: 1 1 auto; }
  .col { min-height: 0; overflow: auto; padding: 16px; border-right: 1px solid var(--line); }
  .col:last-child { border-right: none; }
  .col-title { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 0 0 12px; }
  .hidden { display: none !important; }

  /* path accordion */
  .acc { display: flex; flex-direction: column; gap: 8px; max-width: 1180px; }
  .arow {
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    border-left: 3px solid var(--line-2); overflow: hidden;
  }
  .arow.k-changed { border-left-color: var(--bad); }
  .arow.k-new { border-left-color: var(--accent); }
  .arow.k-unchanged { border-left-color: var(--ink-3); }
  .arow.open { box-shadow: var(--shadow); }
  .ahead {
    display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center;
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: none; border: none; padding: 13px 15px;
  }
  .ahead:hover { background: var(--surface-2); }
  .arow.open .ahead { border-bottom: 1px solid var(--line); }
  .achev { color: var(--ink-3); font-size: 11px; transition: transform .15s ease; }
  .arow.open .achev { transform: rotate(90deg); color: var(--accent); }
  .abody { padding: 4px 15px 16px; }
  .kind {
    font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 5px; display: inline-block; margin-bottom: 6px;
  }
  .kind.k-changed { background: var(--bad-soft); color: var(--bad); }
  .kind.k-new { background: var(--accent-soft); color: var(--accent-ink); }
  .kind.k-unchanged { background: var(--surface-2); color: var(--ink-3); }
  .plabel { font-size: 13.5px; font-weight: 560; line-height: 1.35; display: block; }
  .pdelta { font-size: 11.5px; margin-top: 6px; line-height: 1.45; display: block; }
  .pdelta .was { color: var(--bad); }
  .pdelta .now { color: var(--good); }
  .pdelta .arrow { color: var(--ink-3); margin: 0 4px; }
  .regtag { color: var(--ink-3); margin-left: 6px; }

  /* path detail */
  .dv {
    display: flex; align-items: baseline; gap: 9px; margin: 2px 0 4px;
    font-size: 12px; flex-wrap: wrap;
  }
  .dv-l { color: var(--bad); font-weight: 600; }
  .dv code { font-family: var(--mono); font-size: 11.5px; background: var(--bad-soft); color: var(--bad); padding: 1px 6px; border-radius: 4px; }
  .prov-tick {
    margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .03em;
    color: var(--author); background: var(--author-soft); padding: 2px 7px; border-radius: 4px;
    text-transform: none; cursor: help;
  }
  .cmp { display: grid; gap: 0; margin-top: 18px; }
  .cmp.two { grid-template-columns: 1fr 1fr; gap: 16px; }
  .cmp-side { min-width: 0; }
  .cmp-head { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .cmp-head.was { color: var(--bad); }
  .cmp-head.now { color: var(--good); }
  .cmp-head .tail { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); font-size: 11.5px; }

  .hop { display: grid; grid-template-columns: 24px 1fr; gap: 11px; padding: 6px 8px 6px 0; cursor: pointer; border-radius: 7px; transition: background .12s ease; }
  .hop:hover { background: var(--surface-2); }
  .hop.sel { background: var(--surface-2); }
  /* the before-column is history: let it recede until hovered */
  .cmp-side.was .hop { opacity: .62; }
  .cmp-side.was .hop:hover, .cmp-side.was .hop.sel { opacity: 1; }
  .hrail { position: relative; display: flex; justify-content: center; }
  .hdot { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; background: var(--surface); border: 2px solid var(--line-2); color: var(--ink-3); z-index: 1; }
  .hop .hdot { border-color: var(--line-2); color: var(--ink-3); }
  .hop.bad .hdot { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .hop.good .hdot { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .hline { position: absolute; top: 21px; bottom: -7px; width: 2px; background: var(--line); }
  .hop:last-child .hline { display: none; }
  .hbody { min-width: 0; padding-top: 2px; }
  .hmain { font-size: 13.5px; line-height: 1.4; display: block; }
  .hmain .kw { font-family: var(--mono); font-size: .88em; font-weight: 600; }
  .hop.bad .hmain .kw { color: var(--bad); }
  /* the note is a gloss: only present when the hop is engaged */
  .hnote {
    font-size: 12px; color: var(--ink-3); line-height: 1.45;
    display: none; margin-top: 3px;
  }
  .hop:hover .hnote, .hop.sel .hnote { display: block; }
  /* crossover: a quiet inline marker, not a pill */
  .hlinks { display: none; gap: 12px; flex-wrap: wrap; margin-top: 5px; }
  .hop:hover .hlinks, .hop.sel .hlinks { display: flex; }
  .xlink {
    font: inherit; font-size: 11.5px; font-weight: 560; cursor: pointer;
    background: none; border: none; padding: 0;
    color: var(--accent); border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .xlink:hover { border-bottom-color: var(--accent); }
  /* a persistent dot marks that a hop HAS reasoning, without the label */
  .hasWhy { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: 1px; opacity: .55; }
  .hop:hover .hasWhy, .hop.sel .hasWhy { opacity: 0; }

  /* shared evidence — sticks to the bottom of the pane so clicking a hop
     never scrolls the code out of view */
  .ev-wrap {
    margin-top: 18px; position: sticky; bottom: -16px;
    background: var(--ground); padding: 10px 0 0;
    border-top: 1px solid var(--line);
  }
  .ev-block { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .ev-file { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ev-file .fp { color: var(--ink); }
  .ctx-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--infer-soft); color: var(--infer); padding: 2px 6px; border-radius: 4px; }
  pre.code { margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }

  .cl.hl .ln { color: var(--accent-ink); font-weight: 700; }
  .ev-empty { color: var(--ink-3); font-size: 12.5px; padding: 16px 2px; }

  /* decision track */
  #dec-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .ditem { display: grid; grid-template-columns: 22px 1fr; gap: 10px; width: 100%; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; }
  .ditem:hover { border-color: var(--line-2); }

  .dnum { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; text-align: center; padding: 2px 0; }

  .dtitle { font-size: 13.5px; font-weight: 560; line-height: 1.35; }
  .dmeta { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .sdot { width: 7px; height: 7px; border-radius: 50%; }
  .sdot.author { background: var(--author); }
  .sdot.infer { background: var(--infer-soft); border: 1px dashed var(--infer); }
  .slabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .slabel.author { color: var(--author); }
  .slabel.infer { color: var(--infer); }

  .schip.author { background: var(--author-soft); color: var(--author); border-color: color-mix(in srgb, var(--author) 30%, transparent); }
  .schip.infer { background: var(--infer-soft); color: var(--infer); border-color: color-mix(in srgb, var(--infer) 32%, transparent); border-style: dashed; }
  .dd-title { font-size: 20px; font-weight: 640; letter-spacing: -.015em; margin: 12px 0 7px; text-wrap: balance; line-height: 1.28; }
  .dd-chose { margin: 0 0 14px; font-size: 14.5px; line-height: 1.5; color: var(--ink); max-width: 56ch; }
  .contrast {
    display: flex; gap: 10px; align-items: baseline; margin-bottom: 18px;
    font-size: 13px; line-height: 1.45; padding-left: 11px;
    border-left: 2px solid color-mix(in srgb, var(--bad) 45%, transparent);
  }
  .contrast .ck { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--bad); flex: none; }
  .contrast .cv { color: var(--ink-3); }
  .contrast .strike { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); }
  .declinks { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  code { font-family: var(--mono); font-size: .87em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .lbl { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 6px; }
  .why { margin: 0; font-size: 14.5px; line-height: 1.6; max-width: 58ch; }
  .qbox { border-left: 3px solid var(--author); background: var(--author-soft); padding: 9px 13px; border-radius: 0 8px 8px 0; margin-top: 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  .qbox .qs { display: block; font-size: 11px; color: var(--author); font-weight: 600; margin-top: 5px; }
  .ibox { border-left: 3px solid var(--infer); background: var(--infer-soft); padding: 9px 13px; border-radius: 0 8px 8px 0; margin-top: 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
  .ibox .qs { display: block; font-size: 11px; color: var(--infer); font-weight: 600; margin-top: 5px; }
  .nbox { border-left: 3px solid var(--ink-3); background: var(--surface-2); padding: 9px 13px; border-radius: 0 8px 8px 0; margin-top: 13px; font-size: 12.5px; color: var(--ink-2); }

  @media (prefers-reduced-motion: reduce) { .hop { transition: none; } }
  @media (max-width: 1000px) {
    .cols.beh, .cols.dec { grid-template-columns: 1fr; grid-auto-rows: min-content; overflow: auto; }
    .app { height: auto; max-height: none; }
    .col { border-right: none; border-bottom: 1px solid var(--line); }
    .cmp.two { grid-template-columns: 1fr; }
  }
</style>

<script id="logic">
(function () {
  const D = JSON.parse(document.getElementById("data-holder").textContent);
  const PATHS = D.paths, DECS = D.decisions, CODE = D.code;
  let track = "beh", curPath = PATHS[0].id, curDec = DECS[0].id, ret = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const pathById = (id) => PATHS.find(p => p.id === id);
  const decById = (id) => DECS.find(d => d.id === id);
  const KIND = { changed: "changed", new: "new", unchanged: "unchanged" };

  $("pr-num").textContent = "#" + D.pr.number;
  $("pr-title").textContent = D.pr.title;
  $("pr-repo").textContent = D.pr.repo;
  $("c-beh").textContent = PATHS.length;
  $("c-dec").textContent = DECS.length;

  function setTrack(t, opts) {
    track = t;
    document.querySelectorAll(".track-tab").forEach(b => b.classList.toggle("on", b.dataset.track === t));
    $("view-beh").classList.toggle("hidden", t !== "beh");
    $("view-dec").classList.toggle("hidden", t !== "dec");
    const crumb = $("crumb");
    if (opts && opts.from) {
      $("crumb-text").innerHTML = opts.from;
      crumb.classList.add("show");
    } else if (!opts || !opts.keepCrumb) {
      crumb.classList.remove("show");
      ret = null;
    }
  }

  /* ---------- behaviour track ---------- */
  function renderAccordion() {
    const el = $("path-acc");
    el.innerHTML = "";
    PATHS.forEach(p => {
      const open = p.id === curPath;
      const row = document.createElement("div");
      row.className = `arow k-${KIND[p.kind]}` + (open ? " open" : "");
      row.dataset.path = p.id;

      const delta = p.kind === "changed"
        ? `<span class="pdelta"><span class="was">${esc(p.beforeText)}</span><span class="arrow">→</span><span class="now">${esc(p.afterText)}</span></span>`
        : `<span class="pdelta"><span class="now">${esc(p.afterText)}</span>${p.regression ? '<span class="regtag">↺ regression check</span>' : ""}</span>`;

      row.innerHTML = `
        <button class="ahead" aria-expanded="${open}">
          <span class="kind k-${KIND[p.kind]}">${p.kind}</span>
          <span><span class="plabel">${esc(p.label)}</span>${delta}</span>
          <span class="achev">▶</span>
        </button>
        <div class="abody">${open ? pathBody(p) : ""}</div>`;

      row.querySelector(".ahead").addEventListener("click", () => {
        curPath = (curPath === p.id) ? null : p.id;
        renderAccordion();
      });
      if (!open) row.querySelector(".abody").style.display = "none";
      el.appendChild(row);
    });
    bindHops();
  }

  function pathBody(p) {
    const isCmp = p.kind === "changed" && p.before;
    const diverge = (isCmp && p.divergeAt != null)
      ? `<div class="dv"><span class="dv-l">diverges at step ${p.divergeAt + 1}</span><code>${esc(p.divergeNote || "")}</code></div>` : "";
    if (!isCmp) {
      return `${diverge}<div class="cmp"><div class="cmp-side">
        ${p.after.map((h, i) => hopHtml(h, i, "after", p.id)).join("")}</div></div>`;
    }
    return `${diverge}<div class="cmp two">
      <div class="cmp-side was"><div class="cmp-head was">before <span class="tail">on main</span>${
        p.beforeProvenance === "author" ? '<span class="prov-tick" title="' + esc((p.beforeNote || "") + " — " + (p.beforeSrc || "")) + '">✎ author</span>' : ""
      }</div>${p.before.map((h, i) => hopHtml(h, i, "before", p.id)).join("")}</div>
      <div class="cmp-side"><div class="cmp-head now">after <span class="tail">this PR</span></div>
        ${p.after.map((h, i) => hopHtml(h, i, "after", p.id)).join("")}</div></div>`;
  }

  function bindHops() {
    document.querySelectorAll("#path-acc .hop").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest(".xlink")) return;
        selHop(row.dataset.path, row.dataset.side, +row.dataset.idx);
      });
    });
    document.querySelectorAll("#path-acc [data-goto-dec]").forEach(b =>
      b.addEventListener("click", () => crossToDecision(b.dataset.gotoDec)));
  }

  function hopHtml(h, i, side, pathId) {
    const cls = ["hop"];
    if (h.bad) cls.push("bad");
    if (h.good) cls.push("good");
    const glyph = h.good ? "✓" : (h.bad ? "!" : i + 1);
    const n = (h.decisions || []).length;
    const links = (h.decisions || []).map(id =>
      `<button class="xlink" data-goto-dec="${id}">why?</button>`).join("");
    const linksLabelled = n > 1
      ? (h.decisions || []).map((id, k) => {
          const d = decById(id);
          const short = d ? d.title.split(" ").slice(0, 3).join(" ") : id;
          return `<button class="xlink" data-goto-dec="${id}">why · ${esc(short)}…</button>`;
        }).join("")
      : links;
    return `<div class="${cls.join(" ")}" data-side="${side}" data-idx="${i}" data-path="${pathId}">
      <span class="hrail"><span class="hdot">${glyph}</span><span class="hline"></span></span>
      <span class="hbody">
        <span class="hmain">${h.main}${n ? '<span class="hasWhy"></span>' : ""}</span>
        <span class="hnote">${esc(h.note || "")}</span>
        ${n ? `<span class="hlinks">${linksLabelled}</span>` : ""}
      </span></div>`;
  }

  function selHop(pathId, side, idx) {
    document.querySelectorAll("#path-acc .hop").forEach(r =>
      r.classList.toggle("sel",
        r.dataset.path === pathId && r.dataset.side === side && +r.dataset.idx === idx));
    const p = pathById(pathId);
    const h = p && (p[side] || [])[idx];
    renderCode($("ev-wrap"), h && h.ev);
  }

  function renderCode(slot, evId) {
    if (!slot) return;
    const c = evId && CODE[evId];
    if (!c) { slot.innerHTML = `<div class="ev-empty">No code anchored to this step.</div>`; return; }
    const rows = c.rows.map(([n, t, add]) => {
      const hl = (c.hl && c.hl.length && +n >= c.hl[0] && +n <= c.hl[1]) ? " hl" : "";
      return `<div class="cl${add ? " add" : ""}${hl}"><span class="ln">${n}</span><span class="ct">${esc(t)}</span></div>`;
    }).join("");
    slot.innerHTML = `<div class="ev-block">
      <div class="ev-file"><span class="fp">${esc(c.file)}</span><span>${esc(c.lines)}</span>
      ${c.context ? '<span class="ctx-badge">context · not under review</span>' : ""}</div>
      <pre class="code">${rows}</pre></div>`;
  }

  /* ---------- decision track ---------- */
  function renderDecList() {
    const ol = $("dec-list");
    ol.innerHTML = "";
    DECS.forEach((d, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "ditem" + (d.id === curDec ? " on" : "");
      b.innerHTML = `<span class="dnum">${i + 1}</span><span>
        <span class="dtitle">${esc(d.title)}</span>
        <span class="dmeta"><span class="sdot ${d.source}"></span>
        <span class="slabel ${d.source}">${d.source === "author" ? "author-stated" : "AI-inferred"}</span></span></span>`;
      b.addEventListener("click", () => { curDec = d.id; renderDecList(); renderDec(); });
      li.appendChild(b);
      ol.appendChild(li);
    });
  }

  function renderDec() {
    const d = decById(curDec);
    const chip = d.source === "author"
      ? `<span class="schip author">✎ author-stated</span>`
      : `<span class="schip infer">⚙ AI-inferred</span>`;
    const prov = d.source === "author"
      ? `<div class="qbox">"${d.quote}"<span class="qs">— ${esc(d.quoteSrc)}</span></div>`
      : `<div class="ibox">${d.inferNote}<span class="qs">${esc(d.inferSrc)}</span></div>`;
    const note = d.note ? `<div class="nbox">${esc(d.note)}</div>` : "";
    const back = (d.paths || []).map(pid => {
      const p = pathById(pid);
      return `<button class="xlink" data-goto-path="${pid}">▶ see in behaviour — ${esc(p ? p.label.slice(0, 30) : pid)}${p && p.label.length > 30 ? "…" : ""}</button>`;
    }).join("");

    $("dec-detail").innerHTML = `${chip}
      <h1 class="dd-title">${esc(d.title)}</h1>
      <p class="dd-chose">${d.chose}</p>
      <div class="contrast">
        <span class="ck">instead of</span>
        <span class="cv"><span class="strike">${d.rejected}</span></span>
      </div>
      <div class="lbl">Why it matters</div><p class="why">${d.why}</p>
      ${prov}${note}
      <div class="lbl" style="margin-top:20px">Behaviour it shapes</div>
      <div class="declinks">${back}</div>`;

    $("dec-detail").querySelectorAll("[data-goto-path]").forEach(b =>
      b.addEventListener("click", () => crossToPath(b.dataset.gotoPath, d.id)));
  }

  /* ---------- crossovers ---------- */
  function crossToDecision(id) {
    ret = { track: "beh", path: curPath };
    curDec = id;
    renderDecList(); renderDec();
    const p = pathById(ret.path);
    setTrack("dec", { from: `from behaviour · <strong>${esc(p ? p.label : "")}</strong>` });
  }
  function crossToPath(pid, fromDec) {
    ret = { track: "dec", dec: fromDec };
    curPath = pid;
    renderAccordion();
    const d = decById(fromDec);
    setTrack("beh", { from: `from decision · <strong>${esc(d ? d.title : "")}</strong>` });
    const p = pathById(pid);
    for (const side of ["after", "before"]) {
      const idx = (p[side] || []).findIndex(h => (h.decisions || []).includes(fromDec));
      if (idx >= 0) { selHop(pid, side, idx); break; }
    }
  }
  $("crumb-back").addEventListener("click", () => {
    if (!ret) { setTrack(track); return; }
    if (ret.track === "beh") { curPath = ret.path; renderAccordion(); setTrack("beh"); }
    else { curDec = ret.dec; renderDecList(); renderDec(); setTrack("dec"); }
  });

  document.querySelectorAll(".track-tab").forEach(b =>
    b.addEventListener("click", () => setTrack(b.dataset.track)));
  $("theme-toggle").addEventListener("click", () => {
    const r = document.documentElement, c = r.getAttribute("data-theme");
    const dark = c ? c === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });

  renderAccordion(); renderDecList(); renderDec();
})();
</script>
